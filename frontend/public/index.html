<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VISIONAI — See. Ask. Understand.</title>
  <meta name="theme-color" content="#080B14" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #080B14;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
      text-align: center;
    }
    .bg-glow {
      position: absolute;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, rgba(34, 211, 238, 0.1) 50%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; }
    }
    .card {
      position: relative;
      z-index: 1;
      background: rgba(16, 21, 34, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25) 0%, rgba(34, 211, 238, 0.25) 100%);
      border: 1.5px solid rgba(139, 92, 246, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
      position: relative;
    }
    .logo-icon {
      width: 44px;
      height: 44px;
      color: #22D3EE;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 60%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 13px;
      color: #94A3B8;
      font-weight: 500;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
    }
    .status-text {
      font-size: 14px;
      color: #CBD5E1;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8B5CF6;
      border-right-color: #22D3EE;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
      transition: all 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    .btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }
    .hidden {
      display: none !important;
    }
    .offline-badge {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="card">
    <div class="logo-badge">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </div>

    <h1>VISIONAI</h1>
    <div class="tagline">See. Ask. Understand.</div>

    <div id="loadingSection">
      <div class="spinner"></div>
      <div class="status-text" id="statusMessage">Launching visual intelligence...</div>
    </div>

    <div id="offlineSection" class="hidden">
      <div class="offline-badge">⚡ Offline / Connection Error</div>
      <div class="status-text" id="offlineMessage">Unable to connect to VISIONAI cloud services. Please check your network and retry.</div>
      <button class="btn" id="retryBtn" onclick="attemptConnection()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
        Retry Connection
      </button>
    </div>
  </div>

  <script>
    const TARGET_URL = 'https://esec-chatbot.vercel.app';

    function attemptConnection() {
      const loadingSection = document.getElementById('loadingSection');
      const offlineSection = document.getElementById('offlineSection');
      const statusMessage = document.getElementById('statusMessage');

      loadingSection.classList.remove('hidden');
      offlineSection.classList.add('hidden');
      statusMessage.textContent = 'Connecting to VISIONAI...';

      if (!navigator.onLine) {
        setTimeout(() => {
          loadingSection.classList.add('hidden');
          offlineSection.classList.remove('hidden');
        }, 600);
        return;
      }

      // Check reachability of live app before navigating
      fetch(TARGET_URL + '/manifest.json', { method: 'HEAD', mode: 'no-cors' })
        .then(() => {
          window.location.href = TARGET_URL;
        })
        .catch(() => {
          // Fallback direct navigate
          window.location.href = TARGET_URL;
        });

      // Safety timeout: if navigation does not occur within 5s, reveal retry button
      setTimeout(() => {
        loadingSection.classList.add('hidden');
        offlineSection.classList.remove('hidden');
      }, 5000);
    }

    window.addEventListener('online', attemptConnection);
    window.addEventListener('offline', () => {
      document.getElementById('loadingSection').classList.add('hidden');
      document.getElementById('offlineSection').classList.remove('hidden');
    });

    document.addEventListener('DOMContentLoaded', () => {
      attemptConnection();
    });
  </script>
</body>
</html>
